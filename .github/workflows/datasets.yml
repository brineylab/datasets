name: datasets

# On GitHub's hosted runners only. This never builds, tests, or pulls a dataset. check: every pull
# request, the scripts' unit tests and the changed datasets' rules.

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -I -m unittest discover tests
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF"
          datasets=$(scripts/changed-datasets "origin/$BASE_REF...HEAD")
          [[ -n "$datasets" ]] || { echo "no dataset changed"; exit 0; }
          failed=0
          for d in $datasets; do python3 -I scripts/check.py "datasets/$d" || failed=1; done
          exit "$failed"
